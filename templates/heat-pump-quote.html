      <div class="hpq-panels">
        <section class="hpq-step" data-hpq-step="0" aria-labelledby="hpq-question-0"><h2 id="hpq-question-0" tabindex="-1">Che tipo di cliente sei?</h2><fieldset class="hpq-options hpq-options-three" data-hpq-options="cliente"><legend class="visually-hidden">Tipologia cliente</legend></fieldset><div class="hpq-overview"><h3>La tua pompa di calore.<br>Partiamo da poche, semplici risposte.</h3><ol><li>Indicaci dove si trova il tuo immobile.</li><li>Raccontaci come lo riscaldi oggi.</li><li>Scegli il sistema che distribuisce il calore.</li><li>Dicci cosa ti serve e quando vorresti intervenire.</li><li>Lascia un recapito per approfondire il tuo progetto.</li></ol><p>Non conosci un dettaglio tecnico? Puoi scegliere “Non lo so”.</p></div></section>
        <section class="hpq-step" data-hpq-step="1" hidden aria-labelledby="hpq-question-1"><h2 id="hpq-question-1" tabindex="-1">Dove vuoi installare la pompa di calore?</h2><p class="hpq-intro">Indicaci il comune e il tipo di immobile. Approfondiremo i dettagli durante la valutazione tecnica.</p><label class="hpq-field hpq-city">Comune dell’intervento *<input name="comune" autocomplete="address-level2" type="text" placeholder="Es. Padova" minlength="2" maxlength="120" required></label><fieldset class="hpq-options hpq-options-two" data-hpq-options="immobile"><legend>Di quale immobile si tratta?</legend></fieldset><p class="hpq-note">La disponibilità dell’intervento si conferma in base al comune e al progetto.</p></section>
        <section class="hpq-step" data-hpq-step="2" hidden aria-labelledby="hpq-question-2"><h2 id="hpq-question-2" tabindex="-1">Come riscaldi oggi l’immobile?</h2><p class="hpq-intro">Partiamo dall’impianto che hai già. Se stai costruendo o non conosci un dettaglio, trovi un’opzione dedicata.</p><fieldset class="hpq-options hpq-options-two hpq-options-compact" data-hpq-options="riscaldamento"><legend class="visually-hidden">Riscaldamento attuale</legend></fieldset></section>
        <section class="hpq-step" data-hpq-step="3" hidden aria-labelledby="hpq-question-3"><h2 id="hpq-question-3" tabindex="-1">Come arriva il calore nei tuoi ambienti?</h2><p class="hpq-intro">Termosifoni, pavimento e ventilconvettori hanno esigenze diverse. Indica il sistema presente nella tua casa.</p><fieldset class="hpq-options hpq-options-two hpq-options-compact" data-hpq-options="distribuzione"><legend class="visually-hidden">Distribuzione del calore</legend></fieldset><details class="hpq-extra"><summary>Conosci già superficie e spazi disponibili? <span>Facoltativo</span></summary><div class="hpq-fields"><label class="hpq-field">Superficie indicativa<select name="superficie" data-hpq-select="superficie"><option value="">Seleziona, se conosci il dato</option></select></label><label class="hpq-field">Spazio per l’unità esterna<select name="spazio-esterno" data-hpq-select="spazio-esterno"><option value="">Scegli uno spazio da valutare</option></select></label></div></details></section>
        <section class="hpq-step" data-hpq-step="4" hidden aria-labelledby="hpq-question-4"><h2 id="hpq-question-4" tabindex="-1">Cosa vuoi ottenere dalla pompa di calore?</h2><p class="hpq-intro">Scegli le funzioni da valutare. La configurazione finale dipenderà dall’immobile e dall’impianto.</p><fieldset class="hpq-options hpq-options-three" data-hpq-options="funzioni"><legend class="visually-hidden">Funzioni richieste</legend></fieldset><label class="hpq-field hpq-timeline">Quando vorresti intervenire? *<select name="tempistiche" data-hpq-select="tempistiche" required><option value="">Seleziona una tempistica indicativa</option></select></label></section>
        <section class="hpq-step" data-hpq-step="5" hidden aria-labelledby="hpq-question-5"><h2 id="hpq-question-5" tabindex="-1">Su quale numero possiamo ricontattarti?</h2><p class="hpq-intro">Controlla la tua richiesta e lascia un recapito per parlare della pompa di calore adatta al tuo immobile.</p><details class="hpq-summary" open><summary><strong>La tua richiesta</strong><span>Pompe di calore</span></summary><dl data-hpq-summary></dl></details><div class="hpq-fields"><label class="hpq-field hpq-field-wide">Nome e cognome *<input name="nome" type="text" autocomplete="name" placeholder="Il tuo nome e cognome" minlength="2" maxlength="120" required></label><label class="hpq-field hpq-field-wide" data-hpq-company hidden>Ragione sociale / Nome della ditta *<input name="azienda" type="text" autocomplete="organization" placeholder="Il nome della tua attività" minlength="2" maxlength="160" disabled></label><label class="hpq-field">Telefono / WhatsApp *<input name="telefono" type="tel" autocomplete="tel" placeholder="Es. 333 123 4567" maxlength="30" required></label><label class="hpq-field">Email <span class="hpq-optional">(facoltativa)</span><input name="email" type="email" autocomplete="email" placeholder="nome@email.it" maxlength="254"></label></div><p class="hpq-note">Indica il numero su cui preferisci essere ricontattato. Per un numero estero aggiungi il prefisso internazionale.</p><details class="hpq-extra"><summary>Vuoi aggiungere qualche dettaglio? <span>Facoltativo</span></summary><label class="hpq-field">Dettagli del progetto<textarea name="messaggio" rows="3" maxlength="2000" placeholder="Consumi, spazi disponibili o altre informazioni utili…"></textarea></label></details><label class="hpq-privacy"><input name="privacy" type="checkbox" required><span>Ho letto l’<a href="/privacy-policy/" target="_blank" rel="noopener">informativa privacy</a> e autorizzo il ricontatto per la gestione della mia richiesta.</span></label><p class="hpq-note">Nel passaggio successivo puoi completare l’invio tramite WhatsApp o email.</p></section>
