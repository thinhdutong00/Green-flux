<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#163d2c" />
    <meta name="description" content="Green Flux. Il nuovo sito sta prendendo forma." />
    <title>Green Flux — Prossimamente</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; padding: clamp(24px, 6vw, 80px); background: #f3f5ed; color: #163d2c; font-family: Arial, Helvetica, sans-serif; }
      header { font-size: 18px; font-weight: 700; letter-spacing: -.04em; }
      header span { font-weight: 400; }
      main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 64px 0; }
      .status { display: inline-flex; align-items: center; gap: 9px; padding: 9px 14px; border: 1px solid #c5d2bc; border-radius: 100px; font-size: 12px; }
      .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #568336; }
      h1 { max-width: 900px; margin: 28px 0 20px; font-size: clamp(48px, 8vw, 108px); line-height: 1.02; font-weight: 500; letter-spacing: -.065em; }
      p { margin: 0; max-width: 480px; color: #52634f; font-size: clamp(16px, 2vw, 20px); line-height: 1.6; }
      footer { padding-top: 24px; border-top: 1px solid #d4dccd; font-size: 12px; color: #52634f; }
    </style>
  </head>
  <body>
    <header>GREEN <span>FLUX</span></header>
    <main>
      <div class="status">Prossimamente online</div>
      <h1>Un nuovo inizio.<br />La stessa energia.</h1>
      <p>Il nuovo sito Green Flux sta prendendo forma.<br />Torna presto a trovarci.</p>
    </main>
    <footer>Green Flux</footer>
  </body>
</html>
