 <text x="35" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#2d4a3f">UNITÀ INTERNA</text>
</g>
<!-- cold water pipes to fan coils -->
<g fill="none" stroke="url(#cool)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
 <path d="M505 520V480H340V372H282"/>
 <path d="M505 520V480H600V372H582"/>
 <path d="M505 520V480H340V540H312"/>
</g>
<!-- pipes to outdoor + heat rejected -->
<path d="M700 598H565" fill="none" stroke="#3f8fc9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowC)"/>
<path d="M565 580H700" fill="none" stroke="#e2643a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowH)"/>
<text x="630" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#b3532f">CALORE</text>
<text x="630" y="616" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#3f7fa6">ACQUA FREDDA</text>
<g transform="translate(760 530)">
 <rect x="0" y="0" width="170" height="110" rx="14" fill="#fff" stroke="#2d4a3f" stroke-width="3"/>
 <circle cx="60" cy="55" r="38" fill="#f4f6f0" stroke="#2d4a3f" stroke-width="3"/>
 <g stroke="#2d4a3f" stroke-width="3" fill="none"><path d="M60 55l0-30M60 55l26 15M60 55l-26 15"/></g>
 <circle cx="60" cy="55" r="6" fill="#2d4a3f"/>
 <path d="M120 22h30M120 40h30M120 58h30M120 76h30M120 94h30" stroke="#d6dccb" stroke-width="5" stroke-linecap="round"/>
 <rect x="0" y="110" width="170" height="10" rx="3" fill="#9aa892"/>
 <text x="85" y="-16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#2d4a3f">UNITÀ ESTERNA</text>
</g>
<g fill="none" stroke="#e2643a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowH)">
 <path d="M960 540c50-10 90-30 150-50"/>
 <path d="M960 585c60 0 110 0 180 0"/>
 <path d="M960 630c50 10 90 30 150 50"/>
</g>
<text x="990" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b3532f" letter-spacing=".5">CALORE ESPULSO</text>
<text x="990" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b3532f">il ciclo si inverte: la casa si raffresca</text>
<g transform="translate(120 680)">
 <rect width="780" height="54" rx="12" fill="#102f2d"/>
 <text x="20" y="33" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#edf3e3">Per raffrescare servono <tspan font-weight="700" fill="#c7e6a0">ventilconvettori</tspan> o pavimento radiante: i termosifoni non bastano.</text>
</g>
</svg>
